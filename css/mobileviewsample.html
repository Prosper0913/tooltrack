<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPST ToolTrack - Simplified 4-Tab Mobile Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#6028A8',
                            dark: '#4C1D95',
                            light: '#7C3AED',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-6 font-sans">

    <!-- Mobile Frame Simulation Container -->
    <div class="w-full sm:w-[390px] h-screen sm:h-[844px] bg-slate-950 sm:rounded-[40px] sm:border-[8px] sm:border-slate-800 shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- Top Header Bar -->
        <div class="bg-brand px-4 pt-10 pb-3 flex items-center justify-between text-white shrink-0 shadow-md">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center font-bold text-sm">FP</div>
                <div>
                    <h1 class="font-bold text-xs leading-tight">ToolTrack Mobile</h1>
                    <p class="text-[10px] text-purple-200">Inventory Dashboard</p>
                </div>
            </div>
            <button class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition relative">
                <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                <span class="absolute top-2 right-2 w-1.5 h-1.5 bg-rose-500 rounded-full"></span>
            </button>
        </div>

        <!-- Main Scrollable Screen Content (Tab 1: Tools & Categories) -->
        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4 bg-slate-950">
            
            <!-- Hero Action: Quick Scan Hub Entry -->
            <div class="bg-gradient-to-r from-purple-900/50 to-indigo-900/50 border border-purple-500/30 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-purple-300 font-semibold bg-purple-500/20 px-2 py-0.5 rounded-full">Quick Workflow</span>
                    <h2 class="text-sm font-bold mt-1 text-white">Borrow or Return Items</h2>
                </div>
                <button class="bg-brand hover:bg-brand-light text-white text-xs font-medium px-3.5 py-2 rounded-xl transition shadow-lg shadow-purple-900/50">
                    Launch Scan
                </button>
            </div>

            <!-- Consolidated Category Grid (Replacing clutter) -->
            <div>
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 px-0.5">Inventory Categories</h3>
                <div class="grid grid-cols-3 gap-2.5">
                    <button class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col items-center text-center hover:border-purple-500 transition group">
                        <div class="w-9 h-9 rounded-xl bg-slate-800 text-purple-400 group-hover:bg-brand group-hover:text-white flex items-center justify-center mb-2 transition">
                            <i data-lucide="utensils" class="w-4 h-4"></i>
                        </div>
                        <span class="text-xs font-medium text-slate-200">Cutleries</span>
                    </button>
                    <button class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col items-center text-center hover:border-purple-500 transition group">
                        <div class="w-9 h-9 rounded-xl bg-slate-800 text-purple-400 group-hover:bg-brand group-hover:text-white flex items-center justify-center mb-2 transition">
                            <i data-lucide="wrench" class="w-4 h-4"></i>
                        </div>
                        <span class="text-xs font-medium text-slate-200">Power Tools</span>
                    </button>
                    <button class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col items-center text-center hover:border-purple-500 transition group">
                        <div class="w-9 h-9 rounded-xl bg-slate-800 text-amber-400 group-hover:bg-amber-600 group-hover:text-white flex items-center justify-center mb-2 transition">
                            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                        </div>
                        <span class="text-xs font-medium text-slate-200">Damaged</span>
                    </button>
                </div>
            </div>

            <!-- Quick List Preview -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                    <span class="text-xs font-semibold text-slate-300">Active Inventory Items</span>
                    <span class="text-[10px] text-purple-400 font-medium">View All</span>
                </div>
                
                <!-- Compact Row Tile -->
                <div class="flex items-center justify-between py-1.5">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-7 h-7 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center">
                            <i data-lucide="box" class="w-3.5 h-3.5"></i>
                        </div>
                        <div>
                            <p class="text-xs font-medium text-slate-200">Cordless Drill Pro</p>
                            <p class="text-[9px] text-slate-400 font-mono">INV-001</p>
                        </div>
                    </div>
                    <span class="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 text-[10px] font-medium">11 Available</span>
                </div>
            </div>

        </div>

        <!-- Clean 4-Tab Bottom Navigation Bar (Solving the 8-Menu Problem) -->
        <div class="bg-slate-950 border-t border-slate-800/80 px-4 py-2 flex items-center justify-around shrink-0 text-slate-400">
            <!-- Tab 1: Tools (Consolidates Inventory & Damage Tracking) -->
            <button class="flex flex-col items-center text-brand-light">
                <i data-lucide="box" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1 font-medium">Tools</span>
            </button>
            <!-- Tab 2: Scan (Consolidates Borrow & Return Workflows) -->
            <button class="flex flex-col items-center hover:text-slate-200 transition">
                <i data-lucide="scan-line" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1 font-medium">Scan</span>
            </button>
            <!-- Tab 3: Reports (Consolidates Transaction Logs) -->
            <button class="flex flex-col items-center hover:text-slate-200 transition">
                <i data-lucide="file-bar-chart" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1 font-medium">Reports</span>
            </button>
            <!-- Tab 4: More / Admin (Consolidates User Accounts & Settings) -->
            <button class="flex flex-col items-center hover:text-slate-200 transition">
                <i data-lucide="menu" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1 font-medium">More</span>
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
